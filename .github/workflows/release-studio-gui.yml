name: Release Studio GUI

on:
  release:
    types: [ published ]

permissions:
  contents: write   # required to create the release and upload assets

jobs:
  publish-studio-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built natively on each target OS rather than cross-compiled from
          # a single runner — Avalonia's native dependencies (libSkiaSharp,
          # in particular) are known to be unreliably resolved when
          # cross-publishing for a different OS than the one doing the
          # build (see AvaloniaUI/Avalonia#13853 for the exact same
          # symptom: builds fine on Linux for win-x64, then fails to start
          # with "Unable to load DLL 'libSkiaSharp'").
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish MOGWAI NANO Studio GUI (${{ matrix.rid }})
        shell: bash
        run: >
          dotnet publish src/MogwaiNano/MogwaiNanoStudioGui/MogwaiNanoStudioGui.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          --output publish/${{ matrix.rid }}

      - name: Set binary name
        id: bin
        shell: bash
        run: |
          BIN_NAME="MogwaiNanoStudioGui"
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            BIN_NAME="${BIN_NAME}.exe"
          fi
          echo "name=$BIN_NAME" >> "$GITHUB_OUTPUT"

      - name: Set executable permission (Linux/macOS)
        if: matrix.rid != 'win-x64'
        shell: bash
        run: chmod +x "publish/${{ matrix.rid }}/${{ steps.bin.outputs.name }}"

      - name: Package archive
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            zip "../../mogwai-nano-studio-gui-${{ github.event.release.tag_name }}-${{ matrix.rid }}.zip" "${{ steps.bin.outputs.name }}"
          else
            tar -czf "../../mogwai-nano-studio-gui-${{ github.event.release.tag_name }}-${{ matrix.rid }}.tar.gz" "${{ steps.bin.outputs.name }}"
          fi
          cd ../../

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mogwai-nano-studio-gui-${{ github.event.release.tag_name }}-${{ matrix.rid }}.*
