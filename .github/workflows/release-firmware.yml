name: Attach firmware to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nanoFramework build components
        uses: nanoframework/nanobuild@v1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore packages
        run: nuget restore src/MogwaiNano/MogwaiNano.sln

      - name: Build MogwaiNano device runtime (Release)
        run: msbuild src/MogwaiNano/MogwaiNano/MogwaiNano/MogwaiNano.nfproj -p:Configuration=Release -t:Rebuild

      - name: Attach binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: src/MogwaiNano/MogwaiNano/MogwaiNano/bin/Release/MogwaiNano.bin
